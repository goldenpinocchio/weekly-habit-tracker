<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13081f" />
    <title>Weekly Habit Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <main class="habit-app">
        <section class="frame" aria-label="Weekly habit tracker">
          <div class="frame-top">
            <button class="week-nav" type="button" data-action="prev-week" aria-label="Previous week">‹</button>
            <div class="week-heading">
              <p class="eyebrow">Weekly Habit Tracker</p>
              <h1 id="weekTitle">July 14–20</h1>
            </div>
            <button class="week-nav" type="button" data-action="next-week" aria-label="Next week">›</button>
          </div>

          <div class="board-wrap">
            <div id="trackerBoard" class="tracker-board" role="grid" aria-label="Week grid"></div>
          </div>
        </section>

        <section class="progress-grid" aria-label="Week progress and mission">
          <article class="progress-card accent">
            <div class="progress-gadget" aria-hidden="true">
              <div class="progress-gadget__screen">
                <span class="progress-gadget__heart">♥</span>
                <span class="progress-gadget__face">◡</span>
              </div>
              <div class="progress-gadget__buttons">
                <span></span><span></span>
              </div>
            </div>

            <div class="progress-copy">
              <p class="progress-label">WEEK PROGRESS</p>
              <strong id="totalHearts">0</strong>
              <span id="totalPoints" class="progress-sub">0 / 0</span>
              <div class="progress-bar" aria-hidden="true">
                <span id="progressFill"></span>
              </div>
              <div class="progress-message">
                You’re building amazing habits! <span class="progress-message__heart">♥</span>
              </div>
            </div>
          </article>

          <article class="mission-card" aria-label="Weekly mission">
            <label for="mission">Weekly mission</label>
            <textarea id="mission" rows="4" placeholder="Write your weekly mission here..."></textarea>
          </article>
        </section>

        <section class="toolbar toolbar--compact" aria-label="Week actions">
          <button type="button" data-action="copy-previous">Copy previous week</button>
          <button type="button" data-action="backup">Export / Import</button>
          <button type="button" data-action="today">Today</button>
        </section>

        <nav class="bottom-nav" aria-label="App sections">
          <button type="button" class="nav-item nav-item--active">
            <span>⌂</span>
            <small>Habits</small>
          </button>
          <button type="button" class="nav-item">
            <span>▮▮</span>
            <small>Stats</small>
          </button>
          <button type="button" class="nav-item">
            <span>★</span>
            <small>Achievements</small>
          </button>
          <button type="button" class="nav-item" data-action="backup">
            <span>⚙</span>
            <small>Settings</small>
          </button>
        </nav>
      </main>
    </div>

    <dialog id="habitDialog" class="modal">
      <form method="dialog" id="habitForm" class="modal-card">
        <input type="hidden" id="habitId" />
        <h2 id="habitDialogTitle">Create New Habit</h2>
        <label>
          Habit name
          <input id="habitName" type="text" maxlength="60" placeholder="Read + Write" required />
        </label>
        <label>
          Points
          <select id="habitPoints">
            <option value="1">1 point — half heart</option>
            <option value="2">2 points — full heart</option>
          </select>
        </label>
        <p class="subtle tiny">1 point = half heart. 2 points = full heart.</p>
        <menu>
          <button type="button" class="danger" id="habitDelete">Delete</button>
          <button type="button" data-action="close-habit">Cancel</button>
          <button type="submit" class="primary">Save</button>
        </menu>
      </form>
    </dialog>

    <dialog id="slotDialog" class="modal">
      <div class="modal-card">
        <input type="hidden" id="slotId" />
        <h2 id="slotDialogTitle">Choose a habit</h2>
        <p id="slotDialogMeta" class="subtle"></p>
        <div id="slotOptions" class="stack"></div>
        <menu>
          <button type="button" data-action="close-slot">Close</button>
        </menu>
      </div>
    </dialog>

    <dialog id="backupDialog" class="modal">
      <div class="modal-card">
        <h2>Backup</h2>
        <p class="subtle">Export your data as JSON or restore it later on the same device.</p>
        <div class="stack">
          <button id="exportBackup" class="primary" type="button">Export backup</button>
          <label class="file-picker">
            Import backup
            <input id="importBackup" type="file" accept="application/json" />
          </label>
        </div>
        <menu>
          <button type="button" data-action="close-backup">Close</button>
        </menu>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
